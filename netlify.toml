# Netlify: build the static site and publish dist/.
# There's no server part on Netlify: the "paste a link" API only runs under
# `npm run dev` / `npm run preview`, and that feature is switched off anyway.

[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# A few safe defaults for every page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Built files have a content hash in their names, so they can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The body-tracking engine must be served as WebAssembly.
[[headers]]
  for = "/mediapipe/wasm/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
